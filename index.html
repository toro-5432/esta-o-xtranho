
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Meteorológica Escolar</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <h1>🌤 Estação Meteorológica</h1>

    <p>Colégio - Projeto Escolar</p>

    <div class="pesquisa">
        <input
        type="text"
        id="cidade"
        placeholder="Digite uma cidade">

        <button onclick="buscarClima()">
            Buscar
        </button>
    </div>

    <div class="card">

        <h2 id="nomeCidade">Cidade</h2>

        <img id="icone" src="" alt="">

        <h3 id="temperatura">-- °C</h3>

        <p id="descricao">Descrição</p>

        <div class="dados">

            <div>
                <h4>💧 Umidade</h4>
                <span id="umidade">--%</span>
            </div>

            <div>
                <h4>🌬️ Vento</h4>
                <span id="vento">-- km/h</span>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
